<style>
/* Layout: site-office ledger — sticky header with department tabs; each tab = summary strip, entry form, records. Accent = chalk-line blue used for setting out ceiling levels. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --sunk:#E9ECF1; --line:#D5DAE2;
  --fg:#1B2230; --muted:#5B6576; --accent:#1F5FA8; --accent-soft:#E2EBF7; --on-accent:#FFFFFF;
  --good:#1E7A4C; --good-soft:#E1F2E8; --warn:#A86200; --warn-soft:#FBEED9; --bad:#B3261E; --bad-soft:#F8E1DF;

  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161D; --surface:#1A2029; --sunk:#222A35; --line:#2F3946;
  --fg:#E6EAF0; --muted:#9AA5B5; --accent:#6EA6E8; --accent-soft:#1D2D44; --on-accent:#0E1726;
  --good:#5CC48E; --good-soft:#163026; --warn:#E3A44A; --warn-soft:#352816; --bad:#F08077; --bad-soft:#3A1D1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --sunk:#222A35; --line:#2F3946;
  --fg:#E6EAF0; --muted:#9AA5B5; --accent:#6EA6E8; --accent-soft:#1D2D44; --on-accent:#0E1726;
  --good:#5CC48E; --good-soft:#163026; --warn:#E3A44A; --warn-soft:#352816; --bad:#F08077; --bad-soft:#3A1D1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}

.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-size:1.2rem;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);font-size:.8rem}
.chalk{height:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 14px,transparent 14px 20px);opacity:.55}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:6px 8px;scrollbar-width:none}
nav button{flex:none;border:0;background:transparent;color:var(--muted);font:600 .9rem var(--f-body);padding:8px 13px;border-radius:999px;cursor:pointer}

main{padding-block:18px 56px;display:grid;gap:18px}
h2{font-family:var(--f-display);font-size:1.05rem;margin:0;font-weight:600}
h3{font-family:var(--f-display);font-size:.96rem;margin:0;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;align-content:start}
.panel .kpi{background:var(--bg)}
.kpi .l{color:var(--muted);font-size:.8rem}
.kpi .v{font-family:var(--f-display);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}

label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}

.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:.8rem}

th{color:var(--muted);font-weight:500;text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}

.track{height:9px;background:var(--sunk);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:6px}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto}
.note{font-size:.8rem;color:var(--muted);margin:0}
.ref{color:var(--muted);font-size:.78rem}
.status{font-size:.8rem;color:var(--muted)}

.chart svg{width:100%;height:auto;display:block}
.check{display:grid;gap:6px}
.check label{display:flex;gap:10px;align-items:flex-start;color:var(--fg);font-size:.9rem;padding:8px 10px;border-radius:8px;background:var(--bg);cursor:pointer}
.check input{width:auto;margin-top:5px}
.check label.done span{color:var(--muted);text-decoration:line-through}
.budget-row{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center}
.ag-wrap{max-height:70vh}
table.ag{width:auto;border-collapse:separate;border-spacing:0}
table.ag th,table.ag td{padding:2px;text-align:center;border-bottom:1px solid var(--sunk)}
table.ag th{font-size:.72rem;line-height:1.1;position:sticky;top:0;background:var(--card,var(--bg));z-index:1}
table.ag th span{display:block;opacity:.7}
table.ag .ag-name{position:sticky;inset-inline-start:0;background:var(--card,var(--bg));z-index:2;text-align:start;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;font-size:.85rem;padding-inline:6px}
.ag-c{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:transparent;color:inherit;font-weight:700;cursor:pointer;padding:0}

.ag-P{background:#1E8E5A;border-color:#1E8E5A;color:#fff}
.ag-A{background:#C0392B;border-color:#C0392B;color:#fff}
.ag-L{background:#D68910;border-color:#D68910;color:#fff}
.ag-fri{background:rgba(127,127,127,.12)}
.ag-today{outline:2px solid var(--acc,#1F5FA8)}
.ag-chk{display:flex;align-items:center;gap:6px}
.ag-chk input{width:18px;height:18px}
.panel{min-width:0;max-width:100%}
details{max-width:100%;min-width:0}
details>.tbl{max-width:100%;overflow-x:auto}
.au{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;border-inline-start-width:4px}
.au summary{cursor:pointer;line-height:1.6}
.au-high{border-inline-start-color:#C0392B}.au-med{border-inline-start-color:#D68910}.au-low{border-inline-start-color:#7F8C8D}.au-ok{border-inline-start-color:#1E8E5A}
.au-f{margin:6px 0;padding-inline-start:18px;font-size:.9rem}
.au-resp{margin-top:6px}
.cmp-chart{overflow-x:auto;margin:10px 0 4px}
.cmp-chart svg{display:block;max-width:none}
.cmp-chart .c-prod,.cmp-leg i.c-prod{fill:#1E8E5A;background:#1E8E5A}
.cmp-chart .c-cost,.cmp-leg i.c-cost{fill:#C0392B;background:#C0392B}
.cmp-chart .c-ax{font-size:10px;fill:var(--muted,#888)}
.cmp-chart .c-base{stroke:var(--line,#ccc)}
.cmp-leg{display:flex;gap:16px;font-size:.85rem;margin-bottom:8px}
.cmp-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:6px}
.vc-btns{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.vc-mic{font-size:1.05rem;padding:14px 22px;border-radius:999px}
.vc-mic.on{background:#C0392B;border-color:#C0392B;animation:vcp 1.2s infinite}
@keyframes vcp{50%{opacity:.75}}
.vc-up{cursor:pointer;display:inline-flex;align-items:center}
.vc-st{min-height:1.2em;font-weight:600}
.vc,.vc-draft{min-width:0;max-width:100%}
.vc-draft .tbl{max-width:100%;overflow-x:auto}
.vc-line>*{min-width:0}
.vc-draft{border:1px dashed var(--line,#ccc);border-radius:12px;padding:12px;margin:12px 0}
.vc-tx{white-space:pre-wrap;opacity:.85}
.vc-line{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.vc-skip{opacity:.45}
.vc-cards{display:grid;gap:8px;margin:8px 0}
.vc-card{border:1px solid var(--line,#ddd);border-radius:10px;padding:8px;display:grid;gap:6px}
.vc-r1{display:grid;grid-template-columns:auto 1fr 90px;gap:6px;align-items:center}
.vc-r2{display:grid;grid-template-columns:1.4fr 1fr 70px;gap:6px}
.vc-r1>*,.vc-r2>*{min-width:0;width:100%}
.vc-r1 input[type=checkbox],.vc-line input[type=checkbox]{width:20px;height:20px}
.vc-line{display:flex}
.vc-set{margin-top:12px}
.dlg{position:fixed;inset:0;z-index:25;background:rgba(10,15,25,.45);display:grid;place-items:center;padding:16px;overflow:auto}
.edit-card{width:min(560px,100%);max-height:90vh;overflow:auto}
.answer{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px;font-size:.92rem;line-height:1.7}
.st-P{background:var(--good-soft)!important} .st-A{background:var(--bad-soft)!important} .st-L{background:var(--warn-soft)!important}
.ok{color:var(--good)} .mt{color:var(--warn)} .dn{color:var(--bad)}
@media (max-width:520px){.bar{grid-template-columns:1fr auto}.bar .track{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}
html,body{margin:0}
body.role-site .mgr{display:none!important}
.login{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;place-items:center;padding:16px}
.login form{width:min(360px,100%)}
</style>

<body>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const omr = n => (Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:3});
const n0 = n => (Number(n)||0).toLocaleString("en-US",{maximumFractionDigits:1});
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today = () => iso(new Date());
const addDays = (s,n) => { const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const month = d => (d||"").slice(0,7);
const daysIn = m => new Date(Number(m.slice(0,4)), Number(m.slice(5,7)), 0).getDate();
const sum = (arr,f) => arr.reduce((s,x)=>s+(Number(f(x))||0),0);
const hrs = (a,b) => { if(!a||!b) return 0; const [h1,m1]=a.split(":").map(Number),[h2,m2]=b.split(":").map(Number); return Math.max(0,(h2*60+m2-h1*60-m1)/60-1); };

  contractValue:24050, vatRate:5, payDays:30, qty:6500, durationMonths:3, ldPerDay:240.5, ldMax:2405, targetFinish:"", deductAbsence:false,

  project:{title:"Construction of Plaza Residential and Office Building – Yiti Plaza", main:"Galfar Engineering & Contracting SAOG", employer:"Sustainable Development Investment Company SAOG", scope:"Fixing of Gypsum Ceiling and Application of Ceiling Paint", contractRef:"BFT/SUBC/33761/26"},
  activities:[
    {key:"frame",name:"الهيكل المعدني",en:"Gypsum ceiling – metal framing",rate:1.12,group:"سقف"},
    {key:"board",name:"التلبيس بالألواح",en:"Gypsum ceiling – boarding",rate:0.98,group:"سقف"},
    {key:"joint",name:"الشريط والمعجون",en:"Gypsum ceiling – jointing & taping",rate:0.70,group:"سقف"},
    {key:"primer",name:"البرايمر",en:"Ceiling paint – primer",rate:0.18,group:"دهان"},
    {key:"stucco1",name:"طبقة المعجون الأولى",en:"Ceiling paint – stucco 1st coat",rate:0.18,group:"دهان"},
    {key:"stucco2",name:"طبقة المعجون الثانية",en:"Ceiling paint – stucco 2nd coat",rate:0.18,group:"دهان"},
    {key:"paint1",name:"طبقة الدهان الأولى",en:"Ceiling paint – 1st coat",rate:0.18,group:"دهان"},
    {key:"paint2",name:"طبقة الدهان النهائية",en:"Ceiling paint – final coat",rate:0.18,group:"دهان"}
  ],
  budget:[]
};
const CATS = ["أكل (بمقابل من بهوان)","معدات وأدوات","مواد استهلاكية","سلامة PPE","مواصلات ووقود","تأشيرات وتأمين","اتصالات","رسوم حكومية","صيانة معدات","إيجار معدات","سلف ومصاريف عامة","أخرى"];
const DED_TYPES = ["سلفة","غياب","جزاء","أكل","سكن/أخرى"];
const INV_ST = [["prep","قيد التحضير"],["sub","مقدّم لبهوان"],["cert","معتمد"],["inv","فاتورة مُصدرة"],["paid","مدفوع"]];
const EQ_ST = [["ok","يعمل","ok"],["maint","تحت الصيانة","mt"],["down","لا يعمل","dn"]];
const ATT_ST = [["P","حاضر"],["A","غائب"],["L","إجازة"]];

const S = { opening:[], settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), expenses:[], workers:[], attendance:{}, deductions:[], payroll:{}, progress:[], materials:[], issues:[], invoices:[], checklist:[], equipment:[], equipLog:{}, subs:[], subWork:[], subPay:[], voice:[] };
let db=null, user=null, downloads=null, sampler=null, me=null, tab="dash", ready=false, names={};

let LANG="ar"; try{ LANG=localStorage.getItem("ms-lang")||"ar"; }catch(e){}
const ARX=/[\u0600-\u06FF][\u0600-\u06FF ]*[\u0600-\u06FF]|[\u0600-\u06FF]/g;
function tr(x){ if(LANG!=="en"||x==null) return x; return String(x).replace(/ر\.ع/g,"OMR").replace(ARX,m=>{ const t=EN[m]; return t===undefined?m:t; }); }
let connRaw="جارٍ الاتصال…"; function setConn(t){ connRaw=t; const el=$("#conn"); if(el) el.textContent=tr(t); }
const HEAD0={};
function applyLang(){
  const en=LANG==="en"; document.documentElement.lang=en?"en":"ar"; document.documentElement.dir=en?"ltr":"rtl"; document.body.style.direction=en?"ltr":"rtl";
  document.querySelectorAll("header h1, header .sub, #tabs button, #logout, #login h2, #login label span, #login button").forEach((el,i)=>{ if(HEAD0[i]==null) HEAD0[i]=el.textContent; el.textContent=tr(HEAD0[i]); });
  const b=$("#lang"); b.textContent=en?"عربي":"English"; b.lang=en?"ar":"en"; setConn(connRaw);
}
const XP=(i,bw,W,pl,pr,half)=> LANG==="en" ? pl+(i+(half?.5:0))*bw : W-pr-(i+(half?.5:1))*bw;

function toast(t){ t=tr(t); const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2600); }

/* ================= computations ================= */
const st = () => S.settings;
const acts = () => st().activities||DEFAULT_SETTINGS.activities;
const ACT_ALIAS = {stucco:"stucco1", feno:"paint1"};
const OLD_SPLIT = {stucco:["stucco1","stucco2"], feno:["paint1","paint2"]};
function normActs(list){
  const def=DEFAULT_SETTINGS.activities; if(!Array.isArray(list)||!list.length) return def.map(a=>({...a}));
  const r={}; list.forEach(a=>{ if(OLD_SPLIT[a.key]) OLD_SPLIT[a.key].forEach(k=>{ if(r[k]==null) r[k]=(Number(a.rate)||0)/2; }); else r[a.key]=Number(a.rate); });
  return def.map(d=>({...d, rate: (r[d.key]!=null && !isNaN(r[d.key])) ? r[d.key] : d.rate}));
}
const actKey = k => ACT_ALIAS[k]||k;
const actMap = () => { const m=Object.fromEntries(acts().map(a=>[a.key,a])); Object.entries(ACT_ALIAS).forEach(([o,n])=>{ if(m[n]) m[o]=m[n]; }); return m; };
const fullRate = () => sum(acts(),a=>a.rate);
function valOf(p){ const a=actMap()[p.act]; return (Number(p.qty)||0)*(a?a.rate:0); }
const allWork = () => [...S.opening, ...S.progress];
function doneBy(list=allWork()){ const m={}; acts().forEach(a=>m[a.key]=0); list.forEach(p=>{ const k=actKey(p.act); if(m[k]!=null) m[k]+=Number(p.qty)||0; }); return m; }
function earned(list=allWork()){ const d=doneBy(list); return acts().reduce((s,a)=>s+Math.min(d[a.key],st().qty)*a.rate,0); }
function prodOn(date){ return sum(S.progress.filter(p=>p.date===date),valOf); }
function prodRange(a,b){ return sum(S.progress.filter(p=>p.date>=a&&p.date<=b),valOf); }
function weekStart(d){ const x=new Date(d+"T12:00:00"); const back=(x.getDay()+1)%7; x.setDate(x.getDate()-back); return iso(x); } // week starts Saturday
const workers = () => S.workers.map(w=>({...w, salary: Number(w.salary ?? w.monthly) || 0, extra: Number(w.extra)||0, target: Number(w.target)||0}));
const dayWage = w => w.salary/(Number(st().payDays)||30);
function prodCut(w, r){ if(!r||r.s!=="P"||!w.target||r.qty===undefined||r.qty===""||r.qty===null) return null; const q=Number(r.qty)||0; const pct=Math.min(1,q/w.target); return {q,pct,ded:dayWage(w)*(1-pct)}; }
const activeWorkers = () => workers().filter(w=>w.active!==false);
function attRec(date){ const a=S.attendance[date]; if(!a) return {}; if(a.rec) return a.rec; const r={}; Object.entries(a.present||{}).forEach(([k,v])=>{ if(v) r[k]={s:"P",in:"07:00",out:"18:00"}; }); return r; }
function monthAtt(m, wid){ let P=0,A=0,L=0,H=0,Q=0,PD=0,short=0; const w=workers().find(x=>x.id===wid)||{salary:0,target:0}; Object.keys(S.attendance).filter(d=>month(d)===m).forEach(d=>{ const r=attRec(d)[wid]; if(!r) return; if(r.s==="P"){P++;H+=hrs(r.in,r.out); const c=prodCut(w,r); if(c){ Q+=c.q; PD+=c.ded; if(c.pct<1) short++; } } else if(r.s==="A")A++; else if(r.s==="L")L++; }); return {P,A,L,H,Q,prodDed:PD,short}; }
function payRow(m, w){
  const a=monthAtt(m,w.id); const ded=sum(S.deductions.filter(d=>d.wid===w.id&&month(d.date)===m),d=>d.amount);
  const absDed = st().deductAbsence ? dayWage(w)*a.A : 0;
  const tded = ded + absDed + a.prodDed;
  const net = Math.max(0, w.salary - tded); const pr=S.payroll[m+"_"+w.id]||{};
  return {...a, ded, absDed, tded, net, paid:!!pr.paid, paidDate:pr.paidDate||"", paidAmount:Number(pr.paidAmount)||0};
}
function eqAge(e){ const d=e.buyDate||e.createdAt||today(); return Math.max(0,(new Date(today())-new Date(String(d).slice(0,10)))/864e5/365); }
function eqBook(e){ const p=Number(e.price)||0, life=Number(e.life)||3; return Math.max(0,p*(1-eqAge(e)/life)); }
function eqAssets(){ const own=S.equipment.filter(e=>e.own!=="مستأجرة"); return {n:own.length, cost:sum(own,e=>e.price), book:sum(own,eqBook), monthly:sum(own,e=>(Number(e.price)||0)/((Number(e.life)||3)*12)), missing:own.filter(e=>!Number(e.price)).length}; }
function salariesPaidTotal(){ return sum(Object.values(S.payroll).filter(p=>p.paid),p=>p.paidAmount); }
function subPaidTotal(){ return sum(S.subPay,p=>p.amount); }
function subWorkTotal(){ return sum(S.subWork,w=>(Number(w.qty)||0)*(Number(w.rate)||0)); }
function expensesTotal(list=S.expenses){ return sum(list,e=>e.amount); }
function spentTotal(){ return expensesTotal()+salariesPaidTotal()+subPaidTotal()+foodTotal(); }
function monthlyBudget(){ return sum(activeWorkers(),w=>w.salary+w.extra) + sum(st().budget||[],b=>b.monthly) + (food().on?activeWorkers().length*(Number(food().rate)||0)*30:0); }
function received(){ return sum(S.invoices,i=>i.paidAmount); }
function invoicedNet(){ return sum(S.invoices,i=>i.amount); }
function forecast(){
  const t=today(), from=addDays(t,-13); const recent=S.progress.filter(p=>p.date>=from&&p.date<=t);
  const days=new Set(recent.map(p=>p.date)).size; const avg = days? sum(recent,valOf)/days : 0;
  const remaining = Math.max(0, st().qty*fullRate() - earned());
  if(!avg) return {avg:0, remaining, days:null, finish:null};
  const wd=Math.ceil(remaining/avg); const cal=Math.ceil(wd*7/6);
  return {avg, remaining, days:wd, finish:addDays(t,cal)};
}
function unpaidSalaries(){ // previous months fully, current month accrued
  const res=[]; const months=new Set([month(today())]); Object.keys(S.attendance).forEach(d=>months.add(month(d)));
  [...months].sort().forEach(m=>{ activeWorkers().forEach(w=>{ const r=payRow(m,w); if(!r.paid && (r.P||m<month(today()))) res.push({m,w,net:r.net}); }); });
  return res;
}

function insights(){
  const out=[]; const f=forecast(); const t=today();
  const cash = received() - spentTotal();
  out.push(cash>=0 ? {k:"good",t:`الرصيد النقدي للمشروع موجب: ${omr(cash)} ر.ع`,d:"المحصّل من بهوان أكبر من كل ما صُرف (مصروفات + رواتب مدفوعة + مقاولو باطن)."}
                   : {k:"warn",t:`المشروع ممول من جيبكم حالياً بمبلغ ${omr(-cash)} ر.ع`,d:"طبيعي في البداية لعدم وجود دفعة مقدمة. أول دفعة تصل بعد اعتماد الكشف بـ 30 يوماً، فقدّم الكشف فور مرور 15 يوماً."});
  const eqM2 = earned()/fullRate(); const cost = spentTotal() + sum(unpaidSalaries(),u=>u.net) + (subWorkTotal()-subPaidTotal());
  if(eqM2>20){ const cpm=cost/eqM2; const m=(fullRate()-cpm)/fullRate()*100;
    out.push({k:m>=15?"good":m>=0?"warn":"bad",t:`تكلفة المتر الكامل ${omr(cpm)} ر.ع مقابل سعر العقد ${omr(fullRate())}`,d:m>=0?`هامش الربح الحالي ${n0(m)}%. ${m<15?"الهامش ضيق؛ راقب الإنتاجية والمصاريف.":""}`:"أنتم تخسرون على كل متر. ارفعوا الإنتاج اليومي أو خفّضوا التكلفة فوراً."}); }
  const daily = monthlyBudget()/26;
  if(daily>0){ out.push({k: f.avg>=daily?"good":"warn", t:`نقطة التعادل: إنتاج ${omr(daily)} ر.ع يومياً (≈ ${n0(daily/fullRate())} م² كامل)`, d: f.avg?`متوسط إنتاجكم الحالي ${omr(f.avg)} ر.ع/يوم ${f.avg>=daily?"— فوق التعادل.":"— أقل من التعادل، أي أن المصروف اليومي أكبر من قيمة الإنتاج."}`:"سجّلوا الإنتاج اليومي حتى أقارن."}); }
  if(st().targetFinish && f.finish){ const late=Math.round((new Date(f.finish)-new Date(st().targetFinish))/864e5);
    out.push(late>0?{k:"bad",t:`التأخير المتوقع ${late} يوماً عن ${st().targetFinish}`,d:`الغرامة المحتملة ${omr(Math.min(late*st().ldPerDay,st().ldMax))} ر.ع. زيدوا العمالة أو وثّقوا أسباب التأخير من بهوان في سجل المشاكل.`}:{k:"good",t:"على المسار للانتهاء قبل الموعد المستهدف",d:`الانتهاء المتوقع ${f.finish}.`}); }
  else if(!st().targetFinish) out.push({k:"",t:"حدّد تاريخ الانتهاء المطلوب من بهوان",d:"من الإعدادات في تبويب الفواتير، حتى أحسب خطر الغرامة (240.5 ر.ع/يوم)."});
  const up=unpaidSalaries().filter(u=>u.m<month(t)); if(up.length) out.push({k:"bad",t:`رواتب أشهر سابقة غير مدفوعة: ${up.length} عامل بقيمة ${omr(sum(up,u=>u.net))} ر.ع`,d:"تأخير الرواتب مخالفة لقانون العمل ويعطي بهوان حق المحاسبة (مادة 8.12)."});
  const unbilled = earned()-invoicedNet()-sum(S.opening.filter(o=>o.billed),valOf); if(unbilled>1000) out.push({k:"warn",t:`أعمال منجزة لم تُفوتر بقيمة ${omr(unbilled)} ر.ع`,d:"جهّز كشف القياس وقدّمه؛ كل يوم تأخير في التقديم يؤخر وصول المال."});
  const down=(S.equipment||[]).filter(e=>{ const days=Object.keys(S.equipLog).sort().reverse().slice(0,4); return days.length>=4 && days.every(d=>(S.equipLog[d].st||{})[e.id]==="down"); });
  if(down.length) out.push({k:"bad",t:`معدات عاطلة أكثر من 96 ساعة: ${down.map(e=>e.name).join(" · ")}`,d:"العقد (19.3) يسمح لبهوان بجلب بديل على حسابكم. أصلحوها أو استبدلوها الآن."});
  return out;
}

function chart14(){

  const W=640,H=170,pl=8,pr=8,pt=18,pb=26,bw=(W-pl-pr)/14;

}


/* ---------- وجبات العمال (خصم بهوان) ---------- */
const FOOD_DEF={on:true,rate:1,start:"2026-11-14",basis:"all"};
const food=()=>({...FOOD_DEF,...(st().food||{})});
function foodCount(d){ const f=food(); if(!f.on||!f.rate||d<f.start||d>today()) return 0;
  const ws=workers().filter(w=>(!w.start||w.start<=d));
  if(f.basis==="present"){ const r=attRec(d); return ws.filter(w=>(r[w.id]||{}).s==="P").length; }
  return ws.filter(w=>w.active!==false||(w.end&&w.end>=d)).length; }
const foodOn=d=>foodCount(d)*(Number(food().rate)||0);
function foodRange(a,b){ let s=0; const f=food(); let d=a<f.start?f.start:a; const end=b>today()?today():b; while(d<=end){ s+=foodOn(d); d=addDays(d,1); } return s; }
const foodMonth=m=>foodRange(m+"-01",`${m}-${String(daysIn(m)).padStart(2,"0")}`);
const foodTotal=()=>foodRange(food().start,today());

/* ---------- تكلفة اليوم مقابل إنتاج اليوم ---------- */
function laborOn(d){ const r=attRec(d); let s=0, n=0;
  activeWorkers().forEach(w=>{ const x=r[w.id]; const dw=dayWage(w); const ex=(w.extra||0)/(Number(st().payDays)||30);
    if(!x||!x.s) return; s+=ex;
    if(x.s==="P"){ n++; const c=prodCut(w,x); s+=dw-(c?c.ded:0); }
    else if(!st().deductAbsence) s+=dw; });
  return {cost:s,n}; }
function expOn(d){ const m=month(d);
  const direct=sum(S.expenses.filter(e=>e.date===d&&e.freq!=="monthly"),e=>e.amount);
  const monthly=sum(S.expenses.filter(e=>month(e.date)===m&&e.freq==="monthly"),e=>e.amount)/daysIn(m);
  return direct+monthly; }
const subOn=d=>sum(S.subWork.filter(w=>w.date===d),w=>(Number(w.qty)||0)*(Number(w.rate)||0));
function dayCmp(d){ const L=laborOn(d), F=foodOn(d), E=expOn(d), U=subOn(d), P=prodOn(d); const cost=L.cost+F+E+U; return {d,prod:P,lab:L.cost,n:L.n,food:F,exp:E,sub:U,cost,net:P-cost}; }
let cmpMonth=month(today());
function projStart(){ return st().projectStart||[...Object.keys(S.attendance),...S.progress.map(p=>p.date)].filter(Boolean).sort()[0]||today(); }
function cmpRows(m){ const nd=daysIn(m), t=today(), ps=projStart(); const out=[]; for(let i=1;i<=nd;i++){ const d=`${m}-${String(i).padStart(2,"0")}`; if(d>t) break; if(d<ps) continue; const r=dayCmp(d); if(r.prod||r.cost) out.push(r); } return out; }
function cmpChart(rows){
  if(!rows.length) return "";
  const W=Math.max(320,rows.length*34), H=170, pad=22, mx=Math.max(1,...rows.map(r=>Math.max(r.prod,r.cost)));
  const bw=11, step=(W-pad*2)/rows.length, y=v=>H-pad-(v/mx)*(H-pad*2);
  const bars=rows.map((r,i)=>{ const x=pad+i*step+step/2; return `<g><title>${r.d}: إنتاج ${omr(r.prod)} · تكلفة ${omr(r.cost)}</title><rect x="${x-bw-1}" y="${y(r.prod)}" width="${bw}" height="${H-pad-y(r.prod)}" rx="2" class="c-prod"/><rect x="${x+1}" y="${y(r.cost)}" width="${bw}" height="${H-pad-y(r.cost)}" rx="2" class="c-cost"/><text x="${x}" y="${H-6}" text-anchor="middle" class="c-ax">${Number(r.d.slice(8))}</text></g>`; }).join("");
  return `<div class="cmp-chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="الإنتاج والتكلفة يومياً"><line x1="${pad}" x2="${W-pad}" y1="${H-pad}" y2="${H-pad}" class="c-base"/>${bars}</svg></div><div class="cmp-leg"><span><i class="c-prod"></i>الإنتاج (ر.ع)</span><span><i class="c-cost"></i>التكلفة (ر.ع)</span></div>`;
}

    <div class="kpis">

      <div class="kpi"><span class="l">أمس</span><span class="v">${nb(yd.net)}</span><span class="n">إنتاج ${omr(yd.prod)} · تكلفة ${omr(yd.cost)}</span></div>
      <div class="kpi"><span class="l">الشهر: الإنتاج − التكلفة</span><span class="v">${nb(tot.prod-tot.cost)}</span><span class="n">${rows.length?`${win} من ${rows.length} يوم بربح`:"لا بيانات"}</span></div>
      <div class="kpi"><span class="l">متوسط اليوم</span><span class="v">${nb(rows.length?(tot.prod-tot.cost)/rows.length:0)}</span><span class="n">إنتاج ${omr(rows.length?tot.prod/rows.length:0)} · تكلفة ${omr(rows.length?tot.cost/rows.length:0)}</span></div>

let drDate=today();

function prevWorkDay(d){ let x=addDays(d,-1); for(let i=0;i<7;i++){ if(new Date(x+"T12:00:00").getDay()!==5) return x; x=addDays(x,-1); } return addDays(d,-1); }
function dayStats(d){
  const rec=attRec(d), aw=activeWorkers(); const c={P:0,A:0,L:0,N:0,H:0};
  aw.forEach(w=>{ const r=rec[w.id]; const s=r&&r.s; if(s==="P"){ c.P++; c.H+=hrs(r.in,r.out); } else if(s==="A") c.A++; else if(s==="L") c.L++; else c.N++; });
  const pr=S.progress.filter(p=>p.date===d&&Number(p.qty)); const byAct={}; acts().forEach(a=>byAct[a.key]={q:0,v:0});
  pr.forEach(p=>{ const k=actKey(p.act); if(byAct[k]){ byAct[k].q+=Number(p.qty)||0; byAct[k].v+=valOf(p); } });
  const q=sum(pr,p=>p.qty), val=sum(pr,valOf); const cm=dayCmp(d);
  return {d,c,pr,byAct,q,val,cm};
}

let smDate=today(), smFrom="month";
function smRange(){ const to=smDate>today()?today():smDate; const from=smFrom==="project"?projStart():month(to)+"-01"; return {from:from>to?to:from,to}; }
function eachDay(a,b,fn){ let d=a; let g=0; while(d<=b&&g++<1000){ fn(d); d=addDays(d,1); } }
function wageAccrual(from,to){
  const pd=Number(st().payDays)||30, absDed=!!st().deductAbsence;
  const rows=activeWorkers().map(w=>{ const dw=dayWage(w), ex=(w.extra||0)/pd; let P=0,A=0,L=0,gross=0,prod=0,absC=0,extra=0,Q=0;
    eachDay(from,to,d=>{ const r=attRec(d)[w.id]; if(!r||!r.s) return; extra+=ex;
      if(r.s==="P"){ P++; gross+=dw; const c=prodCut(w,r); if(c){ prod+=c.ded; Q+=c.q; } }
      else { if(r.s==="A") A++; else L++; if(absDed){ if(r.s==="A") absC+=0; } else gross+=dw; } });
    const adv=sum(S.deductions.filter(x=>x.wid===w.id&&x.date>=from&&x.date<=to),x=>x.amount);
    const months=new Set(); eachDay(from,to,d=>months.add(month(d)));
    const paid=sum([...months].map(m=>S.payroll[m+"_"+w.id]).filter(p=>p&&p.paid),p=>p.paidAmount);
    const due=Math.max(0,gross+extra-prod-adv);
    return {w,dw,P,A,L,Q,gross,extra,prod,adv,due,paid,rem:due-paid}; });
  return rows;
}
function smData(){
  const {from,to}=smRange(); const W=wageAccrual(from,to);
  const exp=S.expenses.filter(e=>e.date>=from&&e.date<=to&&e.freq!=="monthly");
  let mshare=0; eachDay(from,to,d=>{ mshare+=sum(S.expenses.filter(e=>month(e.date)===month(d)&&e.freq==="monthly"),e=>e.amount)/daysIn(month(d)); });
  const cats={}; exp.forEach(e=>cats[e.cat||"أخرى"]=(cats[e.cat||"أخرى"]||0)+(Number(e.amount)||0)); if(mshare) cats["مصروفات شهرية (نصيب الفترة)"]=mshare;
  const fd=foodRange(from,to); let fdays=0, fwd=0; eachDay(from,to,d=>{ const n=foodCount(d); if(n){ fdays++; fwd+=n; } });
  const sub=sum(S.subWork.filter(x=>x.date>=from&&x.date<=to),x=>(Number(x.qty)||0)*(Number(x.rate)||0));
  const pr=S.progress.filter(p=>p.date>=from&&p.date<=to&&Number(p.qty)); const byAct={}; acts().forEach(a=>byAct[a.key]={q:0,v:0}); pr.forEach(p=>{ const k=actKey(p.act); if(byAct[k]){ byAct[k].q+=Number(p.qty)||0; byAct[k].v+=valOf(p); } });
  const prod=sum(pr,valOf), q=sum(pr,p=>p.qty);
  const wages=sum(W,r=>r.due), expT=sum(exp,e=>e.amount)+mshare; const cost=wages+expT+fd+sub;
  let days=0; eachDay(from,to,d=>{ if(Object.values(attRec(d)).some(r=>r.s==="P")) days++; });
  return {from,to,W,exp,cats,mshare,expT,fd,fdays,fwd,sub,byAct,prod,q,wages,cost,days,paid:sum(W,r=>r.paid)};
}

/* ---------- جدول الحضور الشهري (تعبئة سريعة وتعديل بأثر رجعي) ---------- */
let agMonth=month(today());
const AG={pend:new Set(),t:null,busy:false};
const AG_CYCLE=["","P","A","L"], AG_LBL={"":"·",P:"ح",A:"غ",L:"إ"};
function agLocal(date,rec){
  S.attendance[date]={date,rec};
  if(window.GS&&GS.data){ const arr=GS.data.attendance=GS.data.attendance||[]; const i=arr.findIndex(x=>x.id===date); const row={...(i>=0?arr[i]:{}),id:date,date,rec}; if(i>=0) arr[i]=row; else arr.push(row); }
}
function agOps(date){
  const rec=attRec(date), now=new Date().toISOString(), ops=[{op:"set",c:"attendance",id:date,data:{date,rec,by:me||null}}];
  Object.keys(rec).forEach(wid=>{ const id="att_"+date+"_"+wid; const r=rec[wid]; const q=r.s==="P"&&r.qty!==""&&r.qty!=null?Number(r.qty)||0:0;
    if(S.progress.some(p=>p.id===id)){ const w=workers().find(x=>x.id===wid)||{}; ops.push({op:"set",c:"progress",id,data:{date,location:r.loc||"",act:r.act||w.act||acts()[0].key,qty:q,notes:"من الحضور: "+(w.name||""),wid,fromAtt:true,createdAt:now,by:me||null}}); } });
  return ops;
}
async function agFlush(){
  clearTimeout(AG.t); AG.t=null; const dates=[...AG.pend]; AG.pend.clear(); if(!dates.length) return;
  if(typeof qPush==="function"){ qPush("apiBatch",[dates.flatMap(agOps)]); agStatus("تم ✓"); return; }
  try{ for(const d of dates){ for(const o of agOps(d)) await setDoc(o.c+"/"+o.id,o.data); } agStatus("تم الحفظ ✓"); }catch(e){ agStatus("تعذّر الحفظ"); }
}
function agQueue(date){ AG.pend.add(date); clearTimeout(AG.t); AG.t=setTimeout(agFlush,700); }
function agStatus(t){ const el=document.getElementById("ag-st"); if(el) el.textContent=tr(t); }
function agSet(date,wid,s){
  const rec={...attRec(date)}; const r={...(rec[wid]||{})};
  if(!s){ delete rec[wid]; } else { r.s=s; if(s==="P"){ r.in=r.in||"07:00"; r.out=r.out||"18:00"; } rec[wid]=r; }
  agLocal(date,rec); agQueue(date);
}

  const from=v("ag-from"), to=v("ag-to"), s=v("ag-s"), fri=document.getElementById("ag-fri").checked, keep=document.getElementById("ag-keep").checked;

async function vcStatus(){ if(!voiceOn()||VC.ai) return; try{ VC.ai=await gsCall("apiAiStatus"); if(tab==="site") soft(); }catch(e){} }
function vcB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]||""); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }); }
async function vcWav(blob){
  const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC();
  let au; try{ au=await ac.decodeAudioData(await blob.arrayBuffer()); } finally { try{ ac.close(); }catch(e){} }
  if(au.duration>VC_MAX+30) throw new Error("التسجيل أطول من 4 دقائق، قسّمه لرسائل أقصر");
  const sr=16000, n=Math.max(1,Math.ceil(au.duration*sr)); const off=new OfflineAudioContext(1,n,sr);
  const src=off.createBufferSource(); src.buffer=au; src.connect(off.destination); src.start(); const out=(await off.startRendering()).getChannelData(0);
  const buf=new ArrayBuffer(44+out.length*2), dv=new DataView(buf); const ws=(o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };
  ws(0,"RIFF"); dv.setUint32(4,36+out.length*2,true); ws(8,"WAVE"); ws(12,"fmt "); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); ws(36,"data"); dv.setUint32(40,out.length*2,true);
  let peak=0; for(let i=0;i<out.length;i++){ const a=Math.abs(out[i]); if(a>peak) peak=a; } const g=peak>0.02&&peak<0.5?0.9/peak:1;
  for(let i=0;i<out.length;i++){ const s=Math.max(-1,Math.min(1,out[i]*g)); dv.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true); }
  return new Blob([buf],{type:"audio/wav"});
}
function vcMime(f){ const n=(f.name||"").toLowerCase(), t=(f.type||"").toLowerCase();
  if(/ogg|opus/.test(t+n)) return "audio/ogg"; if(/mp3|mpeg/.test(t+n)) return "audio/mp3"; if(/aac|m4a|mp4/.test(t+n)) return "audio/aac"; if(/wav/.test(t+n)) return "audio/wav"; if(/flac/.test(t+n)) return "audio/flac"; return t||"audio/ogg"; }
async function vcProcess(blob,src){
  const date=VC.date||today(); VC.busy=true;
  try{
    vcSet("جارٍ تجهيز الصوت…"); let b64, mime;
    try{ const w=await vcWav(blob); b64=await vcB64(w); mime="audio/wav"; }
    catch(e){ if(/أطول/.test(e.message||"")) throw e; b64=await vcB64(blob); mime=vcMime(blob); }
    vcSet("جارٍ الاستماع والتحليل… (10–30 ثانية)");
    const r=await gsCall("apiVoice",b64,mime,date);
    if(!String(r.transcript||"").trim()&&!(r.entries||[]).length&&!(r.issues||[]).length){ vcSet("لم يُسمع كلام واضح في التسجيل. أعد التسجيل بصوت أوضح وبعيداً عن الضوضاء."); return; }
    const wById=Object.fromEntries(workers().map(w=>[w.id,w]));
    const actOk=k=>acts().some(a=>a.key===k)?k:"";
    const D={date,src:src||"",transcript:r.transcript||"",summary:r.summary||"",
      entries:(r.entries||[]).filter(e=>e&&(e.worker_id||e.worker_name||e.qty)).map(e=>{ const w=wById[e.worker_id]; return {wid:w?w.id:"",name:e.worker_name||"",status:["P","A","L"].includes(e.status)?e.status:"P",act:actOk(e.act)||(w&&w.act)||acts()[0].key,location:e.location||"",qty:e.qty==null||e.qty===""?"":Number(e.qty),in:e.in||"",out:e.out||""}; }),
      issues:(r.issues||[]).filter(x=>x&&x.text).map(x=>({text:x.text,days:Number(x.days)||0})),
      equipment:(r.equipment||[]).filter(x=>x&&(x.equip_id||x.name)).map(x=>({eid:S.equipment.some(e=>e.id===x.equip_id)?x.equip_id:"",status:["ok","maint","down"].includes(x.status)?x.status:"down",note:[x.note,!S.equipment.some(e=>e.id===x.equip_id)?x.name:""].filter(Boolean).join(" · ")})),
      materials:(r.materials||[]).filter(x=>x&&x.item).map(x=>({item:x.item,qty:x.qty===""||x.qty==null?"":Number(x.qty),unit:x.unit||""}))};
    VC.drafts.push(D); vcSet("تم التحليل. راجع المسودة ثم اضغط «تأكيد».");
  }catch(e){ vcSet((e&&e.message)||"تعذّر التحليل"); toast((e&&e.message)||"تعذّر التحليل"); }
  finally{ VC.busy=false; render(); }
}
async function vcStart(){
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){ vcSet("الميكروفون غير متاح هنا. استخدم «رفع رسالة صوتية» أو تطبيق الجوال."); return; }
  try{ VC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ vcSet("لم يُسمح باستخدام الميكروفون. اسمح للتطبيق من إعدادات الجوال ← التطبيقات ← المسارة ← الأذونات."); return; }
  const mr=new MediaRecorder(VC.stream); VC.chunks=[]; mr.ondataavailable=e=>{ if(e.data&&e.data.size) VC.chunks.push(e.data); };
  mr.onstop=()=>{ VC.stream?.getTracks().forEach(t=>t.stop()); VC.stream=null; clearInterval(VC.timer); const blob=new Blob(VC.chunks,{type:mr.mimeType||"audio/webm"}); VC.rec=null; if(blob.size<1500){ vcSet("التسجيل قصير جداً"); render(); return; } vcProcess(blob,"تسجيل مباشر"); };
  mr.start(1000); VC.rec=mr; VC.t0=Date.now(); VC.busy=true; render();
  VC.timer=setInterval(()=>{ const s=Math.round((Date.now()-VC.t0)/1000); vcSet(`جارٍ التسجيل… ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}  — تكلّم بوضوح ثم اضغط «إيقاف وإرسال»`); if(s>=VC_MAX) mr.stop(); },500);
}
async function vcFiles(files){ for(const f of files){ if(!f) continue; await vcProcess(f,f.name||"رسالة صوتية"); } }
async function vcConfirm(i){
  const D=VC.drafts[i]; if(!D) return; const date=D.date, now=new Date().toISOString(), ops=[];

      rec[e.wid]=r; if(!touched.includes(e.wid)) touched.push(e.wid); }
    else ops.push({op:"add",c:"progress",data:{date,location:e.location||"",act:e.act,qty:Number(e.qty),notes:"تقرير صوتي"+(e.name?": "+e.name:""),by:me||null,createdAt:now}}); });

function invCalc(from,to){
  const prev=[...S.opening.filter(o=>o.billed), ...S.progress.filter(p=>from&&p.date<from)], cur=[...S.opening.filter(o=>!o.billed), ...S.progress.filter(p=>(!from||p.date>=from)&&p.date<=to)];
  const dp=doneBy(prev), dc=doneBy(cur);
  const lines=acts().map(a=>({a,prevQ:dp[a.key],curQ:dc[a.key],cumQ:dp[a.key]+dc[a.key]}));
  const net=sum(lines,l=>l.curQ*l.a.rate), vat=net*st().vatRate/100;
  return {lines,net,vat,gross:net+vat,prevVal:sum(lines,l=>l.prevQ*l.a.rate),cumVal:sum(lines,l=>l.cumQ*l.a.rate)};
}

const CF_DEF={start:"",plannedDaily:0,crew:22,avgCost:150,otherMonthly:600,mobilization:1000,lag:37,cycle:15};
function cfModel(){
  const c={...CF_DEF,...(st().cf||{})}; const CV=st().contractValue;
  const realLab=sum(activeWorkers(),w=>w.salary+w.extra); const labour=realLab||c.crew*c.avgCost;
  const realOther=sum(st().budget||[],b=>b.monthly); const other=realOther||c.otherMonthly;
  const dayVal=Number(c.plannedDaily)||CV/((st().durationMonths||3)*26);
  const start=c.start||S.progress.map(p=>p.date).sort()[0]||today();
  const day={}; const D=k=>(day[k]=day[k]||{prod:0,in:0,lab:0,oth:0,mob:0,ev:[]});
  D(start).mob=Number(c.mobilization)||0; if(c.mobilization) D(start).ev.push("تحريك وتجهيز");
  let d=start, cum=0, billed=0, lastCut=start, k=0, monthStart=start, finish=null, lastPay=start, g=0;
  while(g++<500){
    const dow=new Date(d+"T12:00:00").getDay();
    if(!finish){
      if(dow!==5){ const p=Math.min(dayVal,CV-cum); cum+=p; D(d).prod+=p; }
      D(d).oth+=other/30;
      const done=cum>=CV-0.001; const cycle=(new Date(d)-new Date(lastCut))/864e5>=c.cycle-1;
      if(cycle||done){ const amt=cum-billed; billed=cum; k++; lastCut=addDays(d,1); D(d).ev.push(`قطع الكشف ${k}`);
        const pd=addDays(d,Number(c.lag)||37); D(pd).in+=amt; D(pd).ev.push(`دفعة ${k}`); if(pd>lastPay) lastPay=pd; }
      const nx=addDays(d,1); if(month(nx)!==month(d)||done){ const days=(new Date(d)-new Date(monthStart))/864e5+1; D(d).lab+=labour*days/daysIn(month(d)); D(d).ev.push("رواتب"); monthStart=nx; }
      if(done) finish=d;
    }
    if(finish && d>=lastPay) break;
    d=addDays(d,1);
  }
  const weeks={}; Object.keys(day).sort().forEach(x=>{ const w=weekStart(x); const W=(weeks[w]=weeks[w]||{w,prod:0,in:0,out:0,ev:[]}); const o=day[x]; W.prod+=o.prod; W.in+=o.in; W.out+=o.lab+o.oth+o.mob; W.ev.push(...o.ev); });
  let bal=0, minBal=0, minW=null, firstIn=null; const rows=Object.values(weeks).sort((a,b)=>a.w.localeCompare(b.w)).map(W=>{ bal+=W.in-W.out; if(bal<minBal){minBal=bal;minW=W.w;} if(W.in&&!firstIn) firstIn=W.w; return {...W,net:W.in-W.out,bal}; });
  return {c,rows,labour,realLab,other,realOther,dayVal,start,finish,peak:-minBal,peakWeek:minW,firstIn,end:bal,totalOut:sum(rows,r=>r.out)};
}
function cfChart(rows){
  if(!rows.length) return ""; const W=660,H=200,pl=8,pr=8,pt=16,pb=24; const bw=(W-pl-pr)/rows.length;
  const vals=rows.flatMap(r=>[r.net,r.bal]); const mx=Math.max(1,...vals), mn=Math.min(0,...vals); const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const bars=rows.map((r,i)=>{ const x=XP(i,bw,W,pl,pr)+2; const y0=y(0), y1=y(r.net); return `<rect x="${x}" y="${Math.min(y0,y1)}" width="${Math.max(2,bw-4)}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="var(${r.net>=0?"--good":"--bad"})" opacity=".55"/>`; }).join("");
  const line=rows.map((r,i)=>`${i?"L":"M"}${XP(i,bw,W,pl,pr,1)} ${y(r.bal)}`).join(" ");
  const ticks=rows.map((r,i)=>i%2?"":`<text x="${XP(i,bw,W,pl,pr,1)}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${r.w.slice(5).replace("-","/")}</text>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="التدفق النقدي الأسبوعي والرصيد التراكمي"><line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${bars}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${ticks}</svg></div><p class="note">الأعمدة: صافي كل أسبوع (أخضر داخل، أحمر خارج). الخط الأزرق: الرصيد التراكمي، وأدنى نقطة فيه هي التمويل الذي تحتاجونه.</p>`;
}

function words(n){
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];

const Q={list:[],busy:false};
const newId=()=>{ const a=new Uint8Array(8); crypto.getRandomValues(a); return [...a].map(x=>x.toString(16).padStart(2,"0")).join(""); };
function gsLocal(c,id,fn){ const arr=GS.data[c]=GS.data[c]||[]; const i=arr.findIndex(r=>r.id===id); const nx=fn(i>=0?arr[i]:null); if(nx===null){ if(i>=0) arr.splice(i,1); } else if(i>=0) arr[i]=nx; else arr.push(nx); GS.subs.forEach(f=>f()); }
function qPush(fn,args){ Q.list.push({fn,args}); setConn("جارٍ الحفظ…"); qRun(); return Promise.resolve(); }
async function qRun(){
  if(Q.busy) return; Q.busy=true;
  while(Q.list.length){ const job=Q.list[0]; let res=null;
    try{ res=await gsCall(job.fn,...job.args); Q.list.shift(); if(!Q.list.length){ const keep=(typeof AG!=="undefined"&&AG.pend.size)?[...AG.pend].map(d=>[d,attRec(d)]):[]; gsApply(res); keep.forEach(([d,r])=>agLocal(d,r)); } }
    catch(e){ if(e&&e.code==="net"){ setConn("لا يوجد اتصال – سيُحفظ عند عودة الإنترنت"); await new Promise(r=>setTimeout(r,5000)); continue; }
      Q.list.shift(); toast((e&&e.message)||"تعذّر الحفظ"); try{ gsApply(await gsCall("apiGetAll")); }catch(_){} } }
  Q.busy=false; setConn((window.ME?window.ME.name+" · ":"")+"متصل · يحفظ تلقائياً لكل الفريق");
}

  const sortDesc=(a,b)=>((b.date||"")+(b.createdAt||"")).localeCompare((a.date||"")+(a.createdAt||""));

  const list=(col,key,sorter)=>db.collection(col).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({id:d.id,...d.data()})); if(sorter) S[key].sort(sorter); });
  const map=(col,key)=>db.collection(col).onSnapshot(snap=>{ S[key]={}; snap.docs.forEach(d=>S[key][d.id]=d.data()); });
  list("expenses","expenses",sortDesc); list("workers","workers"); list("progress","progress",sortDesc); list("deductions","deductions",sortDesc);
  list("materials","materials",sortDesc); list("issues","issues",sortDesc); list("invoices","invoices",(a,b)=>(b.to||"").localeCompare(a.to||"")); list("checklist","checklist");
  list("equipment","equipment"); list("opening","opening"); list("subs","subs"); list("subWork","subWork",sortDesc); list("subPay","subPay",sortDesc); list("voice","voice",sortDesc);
  map("attendance","attendance"); map("payroll","payroll"); map("equipLog","equipLog");
  db.doc("settings/main").onSnapshot(s=>{ if(s.exists){ const d=s.data(); S.settings={...DEFAULT_SETTINGS,...d,company:{...DEFAULT_SETTINGS.company,...(d.company||{})},client:{...DEFAULT_SETTINGS.client,...(d.client||{})},project:{...DEFAULT_SETTINGS.project,...(d.project||{})},activities:normActs(d.activities)}; } live(); });
}

db=shimDb; user=null; downloads=null; sampler=null;
