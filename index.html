.chart svg{width:100%;height:auto;display:block}

.check input{width:auto;margin-top:5px}
.check label.done span{color:var(--muted);text-decoration:line-through}
.budget-row{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center}
.dlg{position:fixed;inset:0;z-index:25;background:rgba(10,15,25,.45);display:grid;place-items:center;padding:16px;overflow:auto}
.edit-card{width:min(560px,100%);max-height:90vh;overflow:auto}
.answer{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px;font-size:.92rem;line-height:1.7}
.st-P{background:var(--good-soft)!important} .st-A{background:var(--bad-soft)!important} .st-L{background:var(--warn-soft)!important}

@media (max-width:520px){.bar{grid-template-columns:1fr auto}.bar .track{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}
html,body{margin:0}
body.role-site .mgr{display:none!important}
.login{position:fixed;inset:0;background:var(--bg);z-index:30;display:grid;place-items:center;padding:16px}
.login form{width:min(360px,100%)}
</style>

let LANG="ar"; try{ LANG=localStorage.getItem("ms-lang")||"ar"; }catch(e){}
const ARX=/[\u0600-\u06FF][\u0600-\u06FF ]*[\u0600-\u06FF]|[\u0600-\u06FF]/g;
function tr(x){ if(LANG!=="en"||x==null) return x; return String(x).replace(/ر\.ع/g,"OMR").replace(ARX,m=>{ const t=EN[m]; return t===undefined?m:t; }); }
let connRaw="جارٍ الاتصال…"; function setConn(t){ connRaw=t; const el=$("#conn"); if(el) el.textContent=tr(t); }
const HEAD0={};
function applyLang(){
  const en=LANG==="en"; document.documentElement.lang=en?"en":"ar"; document.documentElement.dir=en?"ltr":"rtl"; document.body.style.direction=en?"ltr":"rtl";
  document.querySelectorAll("header h1, header .sub, #tabs button, #logout, #login h2, #login label span, #login button").forEach((el,i)=>{ if(HEAD0[i]==null) HEAD0[i]=el.textContent; el.textContent=tr(HEAD0[i]); });
  const b=$("#lang"); b.textContent=en?"عربي":"English"; b.lang=en?"ar":"en"; setConn(connRaw);
}
const XP=(i,bw,W,pl,pr,half)=> LANG==="en" ? pl+(i+(half?.5:0))*bw : W-pr-(i+(half?.5:1))*bw;

function toast(t){ t=tr(t); const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2600); }

/* ================= computations ================= */
const st = () => S.settings;
const acts = () => st().activities||DEFAULT_SETTINGS.activities;
const ACT_ALIAS = {stucco:"stucco1", feno:"paint1"};
const OLD_SPLIT = {stucco:["stucco1","stucco2"], feno:["paint1","paint2"]};
function normActs(list){
  const def=DEFAULT_SETTINGS.activities; if(!Array.isArray(list)||!list.length) return def.map(a=>({...a}));
  const r={}; list.forEach(a=>{ if(OLD_SPLIT[a.key]) OLD_SPLIT[a.key].forEach(k=>{ if(r[k]==null) r[k]=(Number(a.rate)||0)/2; }); else r[a.key]=Number(a.rate); });
  return def.map(d=>({...d, rate: (r[d.key]!=null && !isNaN(r[d.key])) ? r[d.key] : d.rate}));
}
const actKey = k => ACT_ALIAS[k]||k;
const actMap = () => { const m=Object.fromEntries(acts().map(a=>[a.key,a])); Object.entries(ACT_ALIAS).forEach(([o,n])=>{ if(m[n]) m[o]=m[n]; }); return m; };
const fullRate = () => sum(acts(),a=>a.rate);
function valOf(p){ const a=actMap()[p.act]; return (Number(p.qty)||0)*(a?a.rate:0); }
const allWork = () => [...S.opening, ...S.progress];
function doneBy(list=allWork()){ const m={}; acts().forEach(a=>m[a.key]=0); list.forEach(p=>{ const k=actKey(p.act); if(m[k]!=null) m[k]+=Number(p.qty)||0; }); return m; }
function earned(list=allWork()){ const d=doneBy(list); return acts().reduce((s,a)=>s+Math.min(d[a.key],st().qty)*a.rate,0); }
function prodOn(date){ return sum(S.progress.filter(p=>p.date===date),valOf); }
function prodRange(a,b){ return sum(S.progress.filter(p=>p.date>=a&&p.date<=b),valOf); }
function weekStart(d){ const x=new Date(d+"T12:00:00"); const back=(x.getDay()+1)%7; x.setDate(x.getDate()-back); return iso(x); } // week starts Saturday
const workers = () => S.workers.map(w=>({...w, salary: Number(w.salary ?? w.monthly) || 0, extra: Number(w.extra)||0, target: Number(w.target)||0}));
const dayWage = w => w.salary/(Number(st().payDays)||30);
function prodCut(w, r){ if(!r||r.s!=="P"||!w.target||r.qty===undefined||r.qty===""||r.qty===null) return null; const q=Number(r.qty)||0; const pct=Math.min(1,q/w.target); return {q,pct,ded:dayWage(w)*(1-pct)}; }
const activeWorkers = () => workers().filter(w=>w.active!==false);
function attRec(date){ const a=S.attendance[date]; if(!a) return {}; if(a.rec) return a.rec; const r={}; Object.entries(a.present||{}).forEach(([k,v])=>{ if(v) r[k]={s:"P",in:"07:00",out:"18:00"}; }); return r; }
function monthAtt(m, wid){ let P=0,A=0,L=0,H=0,Q=0,PD=0,short=0; const w=workers().find(x=>x.id===wid)||{salary:0,target:0}; Object.keys(S.attendance).filter(d=>month(d)===m).forEach(d=>{ const r=attRec(d)[wid]; if(!r) return; if(r.s==="P"){P++;H+=hrs(r.in,r.out); const c=prodCut(w,r); if(c){ Q+=c.q; PD+=c.ded; if(c.pct<1) short++; } } else if(r.s==="A")A++; else if(r.s==="L")L++; }); return {P,A,L,H,Q,prodDed:PD,short}; }
function payRow(m, w){
  const a=monthAtt(m,w.id); const ded=sum(S.deductions.filter(d=>d.wid===w.id&&month(d.date)===m),d=>d.amount);
  const absDed = st().deductAbsence ? dayWage(w)*a.A : 0;
  const tded = ded + absDed + a.prodDed;
  const net = Math.max(0, w.salary - tded); const pr=S.payroll[m+"_"+w.id]||{};
  return {...a, ded, absDed, tded, net, paid:!!pr.paid, paidDate:pr.paidDate||"", paidAmount:Number(pr.paidAmount)||0};
}
function eqAge(e){ const d=e.buyDate||e.createdAt||today(); return Math.max(0,(new Date(today())-new Date(String(d).slice(0,10)))/864e5/365); }
function eqBook(e){ const p=Number(e.price)||0, life=Number(e.life)||3; return Math.max(0,p*(1-eqAge(e)/life)); }
function eqAssets(){ const own=S.equipment.filter(e=>e.own!=="مستأجرة"); return {n:own.length, cost:sum(own,e=>e.price), book:sum(own,eqBook), monthly:sum(own,e=>(Number(e.price)||0)/((Number(e.life)||3)*12)), missing:own.filter(e=>!Number(e.price)).length}; }
function salariesPaidTotal(){ return sum(Object.values(S.payroll).filter(p=>p.paid),p=>p.paidAmount); }
function subPaidTotal(){ return sum(S.subPay,p=>p.amount); }
function subWorkTotal(){ return sum(S.subWork,w=>(Number(w.qty)||0)*(Number(w.rate)||0)); }
function expensesTotal(list=S.expenses){ return sum(list,e=>e.amount); }
function spentTotal(){ return expensesTotal()+salariesPaidTotal()+subPaidTotal(); }
function monthlyBudget(){ return sum(activeWorkers(),w=>w.salary+w.extra) + sum(st().budget||[],b=>b.monthly); }
function received(){ return sum(S.invoices,i=>i.paidAmount); }
function invoicedNet(){ return sum(S.invoices,i=>i.amount); }
function forecast(){
  const t=today(), from=addDays(t,-13); const recent=S.progress.filter(p=>p.date>=from&&p.date<=t);
  const days=new Set(recent.map(p=>p.date)).size; const avg = days? sum(recent,valOf)/days : 0;
  const remaining = Math.max(0, st().qty*fullRate() - earned());
  if(!avg) return {avg:0, remaining, days:null, finish:null};
  const wd=Math.ceil(remaining/avg); const cal=Math.ceil(wd*7/6);
  return {avg, remaining, days:wd, finish:addDays(t,cal)};
}
function unpaidSalaries(){ // previous months fully, current month accrued
  const res=[]; const months=new Set([month(today())]); Object.keys(S.attendance).forEach(d=>months.add(month(d)));
  [...months].sort().forEach(m=>{ activeWorkers().forEach(w=>{ const r=payRow(m,w); if(!r.paid && (r.P||m<month(today()))) res.push({m,w,net:r.net}); }); });
  return res;
}

function insights(){
  const out=[]; const f=forecast(); const t=today();
  const cash = received() - spentTotal();
  out.push(cash>=0 ? {k:"good",t:`الرصيد النقدي للمشروع موجب: ${omr(cash)} ر.ع`,d:"المحصّل من بهوان أكبر من كل ما صُرف (مصروفات + رواتب مدفوعة + مقاولو باطن)."}
                   : {k:"warn",t:`المشروع ممول من جيبكم حالياً بمبلغ ${omr(-cash)} ر.ع`,d:"طبيعي في البداية لعدم وجود دفعة مقدمة. أول دفعة تصل بعد اعتماد الكشف بـ 30 يوماً، فقدّم الكشف فور مرور 15 يوماً."});
  const eqM2 = earned()/fullRate(); const cost = spentTotal() + sum(unpaidSalaries(),u=>u.net) + (subWorkTotal()-subPaidTotal());
  if(eqM2>20){ const cpm=cost/eqM2; const m=(fullRate()-cpm)/fullRate()*100;
    out.push({k:m>=15?"good":m>=0?"warn":"bad",t:`تكلفة المتر الكامل ${omr(cpm)} ر.ع مقابل سعر العقد ${omr(fullRate())}`,d:m>=0?`هامش الربح الحالي ${n0(m)}%. ${m<15?"الهامش ضيق؛ راقب الإنتاجية والمصاريف.":""}`:"أنتم تخسرون على كل متر. ارفعوا الإنتاج اليومي أو خفّضوا التكلفة فوراً."}); }
  const daily = monthlyBudget()/26;
  if(daily>0){ out.push({k: f.avg>=daily?"good":"warn", t:`نقطة التعادل: إنتاج ${omr(daily)} ر.ع يومياً (≈ ${n0(daily/fullRate())} م² كامل)`, d: f.avg?`متوسط إنتاجكم الحالي ${omr(f.avg)} ر.ع/يوم ${f.avg>=daily?"— فوق التعادل.":"— أقل من التعادل، أي أن المصروف اليومي أكبر من قيمة الإنتاج."}`:"سجّلوا الإنتاج اليومي حتى أقارن."}); }
  if(st().targetFinish && f.finish){ const late=Math.round((new Date(f.finish)-new Date(st().targetFinish))/864e5);
    out.push(late>0?{k:"bad",t:`التأخير المتوقع ${late} يوماً عن ${st().targetFinish}`,d:`الغرامة المحتملة ${omr(Math.min(late*st().ldPerDay,st().ldMax))} ر.ع. زيدوا العمالة أو وثّقوا أسباب التأخير من بهوان في سجل المشاكل.`}:{k:"good",t:"على المسار للانتهاء قبل الموعد المستهدف",d:`الانتهاء المتوقع ${f.finish}.`}); }
  else if(!st().targetFinish) out.push({k:"",t:"حدّد تاريخ الانتهاء المطلوب من بهوان",d:"من الإعدادات في تبويب الفواتير، حتى أحسب خطر الغرامة (240.5 ر.ع/يوم)."});
  const up=unpaidSalaries().filter(u=>u.m<month(t)); if(up.length) out.push({k:"bad",t:`رواتب أشهر سابقة غير مدفوعة: ${up.length} عامل بقيمة ${omr(sum(up,u=>u.net))} ر.ع`,d:"تأخير الرواتب مخالفة لقانون العمل ويعطي بهوان حق المحاسبة (مادة 8.12)."});
  const unbilled = earned()-invoicedNet()-sum(S.opening.filter(o=>o.billed),valOf); if(unbilled>1000) out.push({k:"warn",t:`أعمال منجزة لم تُفوتر بقيمة ${omr(unbilled)} ر.ع`,d:"جهّز كشف القياس وقدّمه؛ كل يوم تأخير في التقديم يؤخر وصول المال."});
  const down=(S.equipment||[]).filter(e=>{ const days=Object.keys(S.equipLog).sort().reverse().slice(0,4); return days.length>=4 && days.every(d=>(S.equipLog[d].st||{})[e.id]==="down"); });
  if(down.length) out.push({k:"bad",t:`معدات عاطلة أكثر من 96 ساعة: ${down.map(e=>e.name).join(" · ")}`,d:"العقد (19.3) يسمح لبهوان بجلب بديل على حسابكم. أصلحوها أو استبدلوها الآن."});
  return out;
}

function chart14(){
  const t=today(); const days=[...Array(14)].map((_,i)=>addDays(t,i-13)); const vals=days.map(prodOn); const max=Math.max(1,...vals);
  const W=640,H=170,pl=8,pr=8,pt=18,pb=26,bw=(W-pl-pr)/14;
  const bars=days.map((d,i)=>{ const h=(H-pt-pb)*vals[i]/max; const x=XP(i,bw,W,pl,pr)+4; return `<rect x="${x}" y="${H-pb-h}" width="${bw-8}" height="${Math.max(h,vals[i]?2:0)}" rx="3" fill="var(${d===t?"--accent":"--line"})"/><text x="${x+(bw-8)/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.slice(8)}</text>${vals[i]?`<text x="${x+(bw-8)/2}" y="${H-pb-h-4}" text-anchor="middle" font-size="9.5" fill="var(--fg)">${Math.round(vals[i])}</text>`:""}`; }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="قيمة الإنتاج اليومي آخر 14 يوماً"><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${bars}</svg></div>`;
}

/* ---------- العمال والرواتب ---------- */
function vHr(){
  const rec=attRec(attDate); const aw=activeWorkers();
  const pres=aw.filter(w=>(rec[w.id]||{}).s==="P").length;
  const rows=aw.map(w=>({w,r:payRow(payMonth,w)}));
  const tot={sal:sum(rows,x=>x.w.salary),ded:sum(rows,x=>x.r.tded),net:sum(rows,x=>x.r.net),paid:sum(rows.filter(x=>x.r.paid),x=>x.r.paidAmount||x.r.net)};
  const pm=[...new Set([month(today()),...Object.keys(S.attendance).map(month),...S.deductions.map(d=>month(d.date))])].sort().reverse();
  return `
  <section class="panel">

  const val=sum(op,valOf), bval=sum(op.filter(o=>o.billed),valOf);
  return `
  <section class="panel">

    <h3>الملخص لكل نشاط (من ${n0(st().qty)} م²)</h3>
    <div class="tbl"><table><thead><tr><th>النشاط</th><th class="num">السابق م²</th><th class="num">فوترت م²</th><th class="num">لم تُفوتر م²</th><th class="num">القيمة</th></tr></thead><tbody>${acts().map(a=>`<tr><td>${esc(a.name)}</td><td class="num">${n0(by[a.key].q)}</td><td class="num">${n0(by[a.key].b)}</td><td class="num">${n0(by[a.key].q-by[a.key].b)}</td><td class="num">${omr(by[a.key].q*a.rate)}</td></tr>`).join("")}</tbody><tfoot><tr><td colspan="4">الإجمالي</td><td class="num">${omr(val)}</td></tr></tfoot></table></div>

function invCalc(from,to){
  const prev=[...S.opening.filter(o=>o.billed), ...S.progress.filter(p=>from&&p.date<from)], cur=[...S.opening.filter(o=>!o.billed), ...S.progress.filter(p=>(!from||p.date>=from)&&p.date<=to)];
  const dp=doneBy(prev), dc=doneBy(cur);
  const lines=acts().map(a=>({a,prevQ:dp[a.key],curQ:dc[a.key],cumQ:dp[a.key]+dc[a.key]}));
  const net=sum(lines,l=>l.curQ*l.a.rate), vat=net*st().vatRate/100;
  return {lines,net,vat,gross:net+vat,prevVal:sum(lines,l=>l.prevQ*l.a.rate),cumVal:sum(lines,l=>l.cumQ*l.a.rate)};
}

/* ---------- التدفق النقدي الأسبوعي ---------- */
const CF_DEF={start:"",plannedDaily:0,crew:22,avgCost:150,otherMonthly:600,mobilization:1000,lag:37,cycle:15};
function cfModel(){
  const c={...CF_DEF,...(st().cf||{})}; const CV=st().contractValue;
  const realLab=sum(activeWorkers(),w=>w.salary+w.extra); const labour=realLab||c.crew*c.avgCost;
  const realOther=sum(st().budget||[],b=>b.monthly); const other=realOther||c.otherMonthly;
  const dayVal=Number(c.plannedDaily)||CV/((st().durationMonths||3)*26);
  const start=c.start||S.progress.map(p=>p.date).sort()[0]||today();
  const day={}; const D=k=>(day[k]=day[k]||{prod:0,in:0,lab:0,oth:0,mob:0,ev:[]});
  D(start).mob=Number(c.mobilization)||0; if(c.mobilization) D(start).ev.push("تحريك وتجهيز");
  let d=start, cum=0, billed=0, lastCut=start, k=0, monthStart=start, finish=null, lastPay=start, g=0;
  while(g++<500){
    const dow=new Date(d+"T12:00:00").getDay();
    if(!finish){
      if(dow!==5){ const p=Math.min(dayVal,CV-cum); cum+=p; D(d).prod+=p; }
      D(d).oth+=other/30;
      const done=cum>=CV-0.001; const cycle=(new Date(d)-new Date(lastCut))/864e5>=c.cycle-1;
      if(cycle||done){ const amt=cum-billed; billed=cum; k++; lastCut=addDays(d,1); D(d).ev.push(`قطع الكشف ${k}`);
        const pd=addDays(d,Number(c.lag)||37); D(pd).in+=amt; D(pd).ev.push(`دفعة ${k}`); if(pd>lastPay) lastPay=pd; }
      const nx=addDays(d,1); if(month(nx)!==month(d)||done){ const days=(new Date(d)-new Date(monthStart))/864e5+1; D(d).lab+=labour*days/daysIn(month(d)); D(d).ev.push("رواتب"); monthStart=nx; }
      if(done) finish=d;
    }
    if(finish && d>=lastPay) break;
    d=addDays(d,1);
  }
  const weeks={}; Object.keys(day).sort().forEach(x=>{ const w=weekStart(x); const W=(weeks[w]=weeks[w]||{w,prod:0,in:0,out:0,ev:[]}); const o=day[x]; W.prod+=o.prod; W.in+=o.in; W.out+=o.lab+o.oth+o.mob; W.ev.push(...o.ev); });
  let bal=0, minBal=0, minW=null, firstIn=null; const rows=Object.values(weeks).sort((a,b)=>a.w.localeCompare(b.w)).map(W=>{ bal+=W.in-W.out; if(bal<minBal){minBal=bal;minW=W.w;} if(W.in&&!firstIn) firstIn=W.w; return {...W,net:W.in-W.out,bal}; });
  return {c,rows,labour,realLab,other,realOther,dayVal,start,finish,peak:-minBal,peakWeek:minW,firstIn,end:bal,totalOut:sum(rows,r=>r.out)};
}
function cfChart(rows){
  if(!rows.length) return ""; const W=660,H=200,pl=8,pr=8,pt=16,pb=24; const bw=(W-pl-pr)/rows.length;
  const vals=rows.flatMap(r=>[r.net,r.bal]); const mx=Math.max(1,...vals), mn=Math.min(0,...vals); const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const bars=rows.map((r,i)=>{ const x=XP(i,bw,W,pl,pr)+2; const y0=y(0), y1=y(r.net); return `<rect x="${x}" y="${Math.min(y0,y1)}" width="${Math.max(2,bw-4)}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="var(${r.net>=0?"--good":"--bad"})" opacity=".55"/>`; }).join("");
  const line=rows.map((r,i)=>`${i?"L":"M"}${XP(i,bw,W,pl,pr,1)} ${y(r.bal)}`).join(" ");
  const ticks=rows.map((r,i)=>i%2?"":`<text x="${XP(i,bw,W,pl,pr,1)}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${r.w.slice(5).replace("-","/")}</text>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="التدفق النقدي الأسبوعي والرصيد التراكمي"><line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${bars}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${ticks}</svg></div><p class="note">الأعمدة: صافي كل أسبوع (أخضر داخل، أحمر خارج). الخط الأزرق: الرصيد التراكمي، وأدنى نقطة فيه هي التمويل الذي تحتاجونه.</p>`;
}

function words(n){
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const h=x=>{ let s=""; if(x>=100){ s+=a[Math.floor(x/100)]+" Hundred"; x%=100; if(x) s+=" "; } if(x>=20){ s+=b[Math.floor(x/10)]+(x%10?"-"+a[x%10]:""); } else if(x) s+=a[x]; return s; };
  const w=x=>{ if(!x) return "Zero"; const parts=[]; const mil=Math.floor(x/1e6), th=Math.floor(x%1e6/1e3), r=x%1e3; if(mil) parts.push(h(mil)+" Million"); if(th) parts.push(h(th)+" Thousand"); if(r) parts.push(h(r)); return parts.join(" "); };
  const r=Math.floor(n+1e-9), bz=Math.round((n-r)*1000);
  return `Rial Omani ${w(r)}${bz?` and Baizas ${w(bz)}`:""} Only`;
}

async function doPrint(kind,arg){
  const r=buildPrint(kind,arg); if(!r){ toast("لا يوجد ما يُطبع"); return; }
  const [title,body,dir]=r; const html=docHtml(tr(title),tr(body),dir||(LANG==="en"?"ltr":"rtl"));
  const w=window.open("","_blank");
  if(w){ w.document.open(); w.document.write(html); w.document.close(); return; }
  const f=document.createElement("iframe"); f.style.cssText="position:fixed;width:0;height:0;border:0;left:-9999px"; document.body.appendChild(f);
  f.contentDocument.open(); f.contentDocument.write(html.replace(/<script>[\s\S]*?<\/script>/,"")); f.contentDocument.close();
  setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast("تعذّرت الطباعة"); } setTimeout(()=>f.remove(),60000); },600);
}

async function add(col,data){ if(!db){toast("قاعدة البيانات غير متاحة");return false;}
  try{ await db.collection(col).add({...data,by:me||null,createdAt:new Date().toISOString()}); toast("تم الحفظ"); return true; }
  catch(e){ toast(e?.code==="not_granted"?"ليس لديك صلاحية الإضافة":"تعذّر الحفظ، حاول مرة أخرى"); return false; } }
async function setDoc(path,data){ if(!db) return; try{ await db.doc(path).set(data); }catch(e){ toast("تعذّر الحفظ"); } }

  if(t.id==="att-all"){ const rec={...attRec(attDate)}; activeWorkers().forEach(w=>{ if(!rec[w.id]||!rec[w.id].s) rec[w.id]={s:"P",in:"07:00",out:"18:00"}; }); await saveAtt(rec); render(); return; }
  if(t.id==="eq-allok"){ const l=S.equipLog[eqDate]||{}; const s={...(l.st||{})}; S.equipment.forEach(e=>{ if(!s[e.id]) s[e.id]="ok"; }); await saveEq(s,l.note||{}); render(); return; }
  if(t.id==="adv-ask"){ askAdvisor(); return; }
  if(t.id==="logout"){ PIN=null; try{localStorage.removeItem("ms-pin")}catch(e){} $("#l-pin").value=""; $("#login").hidden=false; return; }
  if(t.id==="lang"){ LANG=LANG==="en"?"ar":"en"; try{localStorage.setItem("ms-lang",LANG)}catch(e){} applyLang(); render(); return; }
  if(t.id==="adv-stop"){ advCtl?.abort(); return; }
});
document.addEventListener("change", async ev=>{
  const t=ev.target;
  if(t.id==="fin-month"){ finMonth=t.value; render(); return; }
  if(t.id==="att-date"){ attDate=t.value||today(); render(); return; }
  if(t.id==="pay-month"){ payMonth=t.value; render(); return; }
  if(t.id==="eq-date"){ eqDate=t.value||today(); render(); return; }
  if(t.id==="inv-from"){ invFrom=t.value; render(); return; }
  if(t.id==="inv-to"){ invTo=t.value||today(); render(); return; }
  if(t.id==="s-dur"){ saveSettings({durationMonths:Number(t.value)||3}); return; }
  if(t.id==="s-absded"){ await saveSettings({deductAbsence:t.checked}); render(); return; }
  if(t.dataset.bud!=null){ const b=[...(st().budget||[])]; b[t.dataset.bud]={...b[t.dataset.bud],monthly:Number(t.value)||0}; saveSettings({budget:b}); return; }
  if(t.dataset.rate!=null){ saveSettings({activities:acts().map((x,i)=>i==t.dataset.rate?{...x,rate:Number(t.value)||0}:x)}); return; }
  if(t.dataset.wtarget){ upd("workers/"+t.dataset.wtarget,{target:Number(t.value)||0}); return; }
  if(t.id==="s-paydays"){ await saveSettings({payDays:Number(t.value)||30}); render(); return; }
  if(t.dataset.attq||t.dataset.atta||t.dataset.attl){ const id=t.dataset.attq||t.dataset.atta||t.dataset.attl; const rec={...attRec(attDate)}; const r={...(rec[id]||{})};
    if(t.dataset.attq) r.qty=t.value===""?"":Number(t.value); if(t.dataset.atta) r.act=t.value; if(t.dataset.attl) r.loc=t.value.trim();
    rec[id]=r; await saveAtt(rec); await syncProd(id); render(); return; }
  if(t.dataset.wsal){ upd("workers/"+t.dataset.wsal,{salary:Number(t.value)||0}); return; }
  if(t.dataset.atts||t.dataset.atti||t.dataset.atto){ const id=t.dataset.atts||t.dataset.atti||t.dataset.atto; const rec={...attRec(attDate)}; const r={...(rec[id]||{})};
    if(t.dataset.atts){ r.s=t.value; if(t.value==="P"){ r.in=r.in||"07:00"; r.out=r.out||"18:00"; } }
    if(t.dataset.atti) r.in=t.value; if(t.dataset.atto) r.out=t.value; rec[id]=r; await saveAtt(rec); if(t.dataset.atts) await syncProd(id); return; }
  if(t.dataset.eqs||t.dataset.eqn){ const l=S.equipLog[eqDate]||{}; const s={...(l.st||{})}, n={...(l.note||{})}; if(t.dataset.eqs) s[t.dataset.eqs]=t.value; else n[t.dataset.eqn]=t.value; await saveEq(s,n); return; }
  if(t.dataset.chk){ upd("checklist/"+t.dataset.chk,{done:t.checked}); return; }
  if(t.dataset.invst){ upd("invoices/"+t.dataset.invst,{status:t.value}); return; }
  if(t.dataset.invpaid){ upd("invoices/"+t.dataset.invpaid,{paidAmount:Number(t.value)||0}); return; }
  if(t.dataset.invdate){ upd("invoices/"+t.dataset.invdate,{paidDate:t.value}); return; }
});

/* re-render without wiping a field someone is using */
let pending=false;
function soft(){ const a=document.activeElement; if(a&&a.matches&&a.matches("input,select,textarea")&&(a.closest("form")||a.id==="adv-q")&&a.value){ pending=true; return; } pending=false; render(); }
document.addEventListener("focusout",()=>setTimeout(()=>{ if(pending) soft(); },50));

try{ const s=localStorage.getItem("ms-tab"); if(s) tab=s; }catch(e){}
applyLang();
render();
/* ---------- Google Sheets data layer ---------- */
let PIN=null; const GS={data:{},subs:[]};
const API_URL="https://script.google.com/macros/s/AKfycbzbRGyhPNzbSuKEH6FlPydVhsYjw6dnkGlzlCum_Mh-r-ZXVZKBeQ3REUPwrgJ_gv6pVA/exec";
function gsCall(fn,...a){ return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args:[PIN,...a]})}).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }).then(j=>{ if(j.error) throw {code:"error",message:j.error}; return j.result; }, e=>{ throw (e&&e.code)?e:{code:"net",message:"تعذّر الاتصال، تحقق من الإنترنت"}; }); }
function gsApply(d){ GS.data=d||{}; if(d&&d.me){ me=d.me.name; document.body.classList.toggle("role-site",d.me.role!=="manager"); window.ME=d.me; } GS.subs.forEach(f=>f()); }
async function gsRun(fn,...a){ try{ gsApply(await gsCall(fn,...a)); }catch(e){ toast(e.message||"تعذّر الاتصال"); throw e; } }
const shimDb={
  collection:c=>({ onSnapshot(fn){ const run=()=>fn({docs:(GS.data[c]||[]).map(x=>({id:x.id,data:()=>{ const o={...x}; delete o.id; return o; }}))}); GS.subs.push(run); return ()=>{}; },
                   add:d=>gsRun("apiAdd",c,d) }),
  doc:p=>{ const [c,id]=p.split("/"); return {
    onSnapshot(fn){ const run=()=>{ const x=(GS.data[c]||[]).find(r=>r.id===id); fn({exists:!!x,data:()=>{ const o={...x}; delete o.id; return o; }}); }; GS.subs.push(run); return ()=>{}; },
    set:d=>gsRun("apiSet",c,id,d), update:d=>gsRun("apiUpdate",c,id,d), delete:()=>gsRun("apiDelete",c,id) }; }
};
function subscribeAll(){
  const sortDesc=(a,b)=>((b.date||"")+(b.createdAt||"")).localeCompare((a.date||"")+(a.createdAt||""));
  const live=()=>{ ready=true; setConn((window.ME?window.ME.name+" · ":"")+"متصل · يحفظ تلقائياً لكل الفريق"); soft(); };
  const list=(col,key,sorter)=>db.collection(col).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({id:d.id,...d.data()})); if(sorter) S[key].sort(sorter); });
  const map=(col,key)=>db.collection(col).onSnapshot(snap=>{ S[key]={}; snap.docs.forEach(d=>S[key][d.id]=d.data()); });
  list("expenses","expenses",sortDesc); list("workers","workers"); list("progress","progress",sortDesc); list("deductions","deductions",sortDesc);
  list("materials","materials",sortDesc); list("issues","issues",sortDesc); list("invoices","invoices",(a,b)=>(b.to||"").localeCompare(a.to||"")); list("checklist","checklist");
  list("equipment","equipment"); list("opening","opening"); list("subs","subs"); list("subWork","subWork",sortDesc); list("subPay","subPay",sortDesc);
  map("attendance","attendance"); map("payroll","payroll"); map("equipLog","equipLog");
  db.doc("settings/main").onSnapshot(s=>{ if(s.exists){ const d=s.data(); S.settings={...DEFAULT_SETTINGS,...d,company:{...DEFAULT_SETTINGS.company,...(d.company||{})},client:{...DEFAULT_SETTINGS.client,...(d.client||{})},project:{...DEFAULT_SETTINGS.project,...(d.project||{})},activities:normActs(d.activities)}; } live(); });
}
async function login(pin){
  PIN=String(pin||"").trim(); $("#l-err").textContent=tr("جارٍ الدخول…");
  try{ gsApply(await gsCall("apiGetAll")); try{ localStorage.setItem("ms-pin",PIN); }catch(e){}
    $("#login").hidden=true; $("#l-err").textContent="";
    if(window.ME.role!=="manager" && ["dash","fin","bill","subs","adv"].includes(tab)) tab="site"; render(); }
  catch(e){ PIN=null; $("#login").hidden=false; $("#l-err").textContent=(e&&e.message)||tr("تعذّر الدخول"); }
}
db=shimDb; user=null; downloads=null; sampler=null;
subscribeAll();
let savedPin=null; try{ savedPin=localStorage.getItem("ms-pin"); }catch(e){}
if(savedPin) login(savedPin); else $("#login").hidden=false;
setInterval(()=>{ if(PIN&&!document.hidden&&!document.activeElement?.matches?.("input,select,textarea")) gsCall("apiGetAll").then(gsApply).catch(()=>{}); },60000);
document.addEventListener("visibilitychange",()=>{ if(PIN&&!document.hidden) gsCall("apiGetAll").then(gsApply).catch(()=>{}); });
